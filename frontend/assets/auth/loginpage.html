<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Back</title>
    <link href="https://googleapis.com" rel="stylesheet" />
    <link rel="stylesheet" href="/frontend/assets/auth/css/login.css" />
  </head>
  <body>
    <div class="container">
      <!-- Visual Side -->
      <div class="visual-side">
        <div class="brand-logo">Steam-fetch.</div>
        <div class="visual-text">
          <h1>Welcome back to the studio.</h1>
          <p>
            Pick up right where you left off. Access your workspaces, designs,
            and metrics effortlessly.
          </p>
        </div>
      </div>

      <!-- Form Side -->
      <div class="form-side">
        <div class="form-wrapper">
          <div class="form-header">
            <h2>Welcome back</h2>
            <p>Don't have an account? <a href="signup.html">Sign up</a></p>
          </div>

          <form id="loginForm">
            <div class="input-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="form-utilities">
              <label class="remember-me">
                <input type="checkbox" /> Remember me
              </label>
              <a href="#" class="forgot-pass">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
          </form>

          <div class="divider">or sign in with</div>

          <button class="btn-google">
            <img src="https://svgrepo.com" alt="Google" />
            Sign in with Google
          </button>
        </div>
      </div>
    </div>
    <script src="/frontend/assets/js/login.js"></script>
  </body>
</html>
