<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Back</title>
    <link href="https://googleapis.com" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      body {
        display: flex;
        min-height: 100vh;
        background-color: #0b0c10;
        color: #ffffff;
        overflow: hidden;
      }

      /* Split Screen Layout */
      .container {
        display: flex;
        width: 100%;
      }

      /* Left Side: Aesthetic Visuals */
      .visual-side {
        flex: 1.2;
        background:
          linear-gradient(
            135deg,
            rgba(168, 85, 247, 0.8),
            rgba(99, 102, 241, 0.8)
          ),
          url("https://unsplash.com") no-repeat center center;
        background-size: cover;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 60px;
      }

      .visual-side::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
          circle at 20% 20%,
          transparent 0%,
          rgba(11, 12, 16, 0.4) 100%
        );
      }

      .brand-logo {
        position: absolute;
        top: 40px;
        left: 60px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #fff;
      }

      .visual-text {
        position: relative;
        z-index: 10;
        max-width: 480px;
      }

      .visual-text h1 {
        font-size: 40px;
        font-weight: 600;
        line-height: 1.2;
        margin-bottom: 20px;
        letter-spacing: -1px;
      }

      .visual-text p {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.8);
        line-height: 1.6;
      }

      /* Right Side: Form Content */
      .form-side {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        background-color: #0f111a;
      }

      .form-wrapper {
        width: 100%;
        max-width: 420px;
      }

      .form-header {
        margin-bottom: 32px;
      }

      .form-header h2 {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }

      .form-header p {
        color: #94a3b8;
        font-size: 15px;
      }

      .form-header a {
        color: #6366f1;
        text-decoration: none;
        font-weight: 500;
      }

      .form-header a:hover {
        text-decoration: underline;
      }

      /* Form Controls */
      .input-group {
        margin-bottom: 20px;
      }

      .input-group label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 8px;
        color: #cbd5e1;
      }

      .input-group input {
        width: 100%;
        padding: 14px 16px;
        background-color: #1e2235;
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        color: #fff;
        font-size: 15px;
        outline: none;
        transition: all 0.3s ease;
      }

      .input-group input:focus {
        border-color: #6366f1;
        background-color: #23273f;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
      }

      /* Remember Me & Forgot Password Utilities */
      .form-utilities {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        font-size: 14px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #cbd5e1;
        cursor: pointer;
      }

      .remember-me input {
        accent-color: #6366f1;
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .forgot-pass {
        color: #6366f1;
        text-decoration: none;
        font-weight: 500;
      }

      .forgot-pass:hover {
        text-decoration: underline;
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #a855f7, #6366f1);
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
      }

      .btn-submit:active {
        transform: translateY(0);
      }

      /* Divider */
      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 24px 0;
        color: #475569;
        font-size: 13px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #1e2235;
      }

      .divider:not(:empty)::before {
        margin-right: 0.75em;
      }
      .divider:not(:empty)::after {
        margin-left: 0.75em;
      }

      /* Social OAuth Button */
      .btn-google {
        width: 100%;
        padding: 14px;
        background-color: transparent;
        border: 1px solid #334155;
        border-radius: 12px;
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: background-color 0.3s ease;
      }

      .btn-google:hover {
        background-color: rgba(255, 255, 255, 0.03);
      }

      .btn-google img {
        width: 20px;
        height: 20px;
      }

      /* Responsive Design */
      @media (max-width: 900px) {
        .visual-side {
          display: none;
        }
        .form-side {
          background-color: #0b0c10;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Visual Side -->
      <div class="visual-side">
        <div class="brand-logo">Steam-fetch.</div>
        <div class="visual-text">
          <h1>Welcome back to the studio.</h1>
          <p>
            Pick up right where you left off. Access your workspaces, designs,
            and metrics effortlessly.
          </p>
        </div>
      </div>

      <!-- Form Side -->
      <div class="form-side">
        <div class="form-wrapper">
          <div class="form-header">
            <h2>Welcome back</h2>
            <p>Don't have an account? <a href="signup.html">Sign up</a></p>
          </div>

          <form>
            <div class="input-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="form-utilities">
              <label class="remember-me">
                <input type="checkbox" /> Remember me
              </label>
              <a href="#" class="forgot-pass">Forgot password?</a>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
          </form>

          <div class="divider">or sign in with</div>

          <button class="btn-google">
            <img src="https://svgrepo.com" alt="Google" />
            Sign in with Google
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
